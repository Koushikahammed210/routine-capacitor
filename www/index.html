<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1b2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Routine">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';">
  <title>Routine Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
:root {
  --bg:#0d1b2a; --surface:#162032; --surface2:#1e2d40; --surface3:#253548;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --text:#e8f0f8; --text2:#8aa4be; --text3:#4d6a82;
  --accent:#f5a623; --accent2:#e8961a;
  --green:#34c759; --green-dim:rgba(52,199,89,0.12); --green-border:rgba(52,199,89,0.25);
  --red:#ff3b30; --red-dim:rgba(255,59,48,0.12);
  --teal:#00c9b1; --electric:#4f8fff;
  --font:'Space Grotesk',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --r:16px; --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{background:var(--bg);font-family:var(--font);color:var(--text);min-block-size:100dvh;overflow-x:hidden}

/* ── HEADER ─────────────────────────────── */
.header{background:var(--surface);border-block-end:1px solid var(--border);padding:14px 16px 0;position:sticky;inset-block-start:0;z-index:100}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-block-end:14px}
.app-title{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
.notif-btn{background:none;border:1px solid var(--border2);border-radius:20px;color:var(--text2);font-family:var(--font);font-size:11px;font-weight:600;padding:4px 12px;cursor:pointer;transition:all .15s}
.notif-btn.active{border-color:rgba(52,199,89,.4);color:var(--green)}
.notif-btn:active{transform:scale(.95)}
.nav-tabs{display:flex;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{flex:none;background:none;border:none;color:var(--text3);font-family:var(--font);font-size:13px;font-weight:600;padding:10px 16px;cursor:pointer;border-block-end:2px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap}
.nav-tab.active{color:var(--accent);border-block-end-color:var(--accent)}
.nav-tab[data-tab="edit"].active{color:#ff9f43;border-block-end-color:#ff9f43}

/* ── MAIN ───────────────────────────────── */
.main{padding:16px;padding-block-end:calc(76px + var(--safe-bottom))}

/* ── PROGRESS HERO ──────────────────────── */
.progress-hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-block-end:12px;display:flex;align-items:center;gap:18px}
.ring-wrap{position:relative;flex-shrink:0}
.ring-wrap svg{display:block}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:21px;font-weight:700;font-family:var(--mono);color:var(--text)}
.ring-lbl{font-size:9px;color:var(--text3);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-block-start:-2px}
.hero-info{flex:1;min-inline-size:0}
.hero-day{font-size:26px;font-weight:700;color:var(--text);line-height:1.1;letter-spacing:-.5px}
.hero-sub{font-size:12px;color:var(--text3);margin-block-start:3px;font-family:var(--mono)}
.hero-stats{display:flex;gap:8px;margin-block-start:10px;flex-wrap:wrap}
.hstat{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--text2)}
.hstat strong{color:var(--text);font-weight:600}

/* ── STREAK WIDGET ──────────────────────── */
.streak-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-block-end:12px;display:flex;align-items:center;gap:14px}
.streak-text{flex:1}
.streak-num{font-size:20px;font-weight:700;color:var(--accent);font-family:var(--mono);line-height:1}
.streak-lbl{font-size:11px;color:var(--text3);margin-block-start:2px}
.week-circles{display:flex;gap:5px}
.wc{inline-size:32px;block-size:32px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.wc svg{position:absolute;inset:0;inline-size:100%;block-size:100%;overflow:visible}
.wc-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;line-height:1}
.wc-day{font-size:7px;font-weight:700;text-transform:uppercase;color:var(--text3)}
.wc-pct{font-size:8px;font-weight:700;color:var(--text3)}
.wc.done .wc-day,.wc.done .wc-pct{color:var(--green)}
.wc.today .wc-day,.wc.today .wc-pct{color:var(--accent)}
.wc.missed .wc-day,.wc.missed .wc-pct{color:var(--text3)}

/* ── SECTION LABEL ──────────────────────── */
.section-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin:18px 0 10px}

/* ── TASK CARD (Today/Backdate) ─────────── */
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-block-end:8px;overflow:hidden;transition:border-color .2s,background .2s}
.task-card.done{border-color:var(--green-border);background:#0c1a0e}
.task-row{display:flex;align-items:center;gap:12px;padding:13px 14px;min-block-size:64px}
.task-check{inline-size:44px;block-size:44px;border-radius:50%;border:2px solid var(--border2);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .18s ease;-webkit-tap-highlight-color:transparent}
.task-check:active{transform:scale(.9)}
.task-check.checked{background:var(--green);border-color:var(--green)}
.task-check svg{opacity:0;transform:scale(.6);transition:all .18s ease}
.task-check.checked svg{opacity:1;transform:scale(1)}
.task-meta{flex:1;min-inline-size:0}
.task-name{font-size:14px;font-weight:500;color:var(--text);line-height:1.3}
.task-card.done .task-name{color:var(--text3);text-decoration:line-through;text-decoration-color:var(--text3)}
.task-time{font-family:var(--mono);font-size:11px;color:var(--text3);margin-block-start:3px}
.task-badge{display:inline-flex;align-items:center;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:20px;margin-block-start:4px}
.task-ts{font-family:var(--mono);font-size:10px;color:var(--green);background:var(--green-dim);border:1px solid var(--green-border);border-radius:8px;padding:3px 8px;flex-shrink:0;white-space:nowrap}

/* ── EDIT LIST (compact) ────────────────── */
.edit-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-block-end:6px;display:flex;align-items:center;gap:10px;padding:11px 12px;position:relative}
.edit-item-icon{inline-size:34px;block-size:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--surface2)}
.edit-item-meta{flex:1;min-inline-size:0}
.edit-item-name{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edit-item-time{font-family:var(--mono);font-size:10px;color:var(--text3);margin-block-start:1px}
.edit-item-type{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-block-start:2px}
.edit-kebab{inline-size:36px;block-size:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text3);font-size:20px;flex-shrink:0;border-radius:8px;transition:background .12s}
.edit-kebab:active{background:var(--surface2)}

/* Swipe-action wrapper */
.swipe-wrap{position:relative;overflow:hidden;border-radius:12px;margin-block-end:6px}
.swipe-reveal{position:absolute;inset-block-start:0;inset-inline-end:0;inset-block-end:0;inline-size:90px;display:flex;align-items:center;justify-content:center;background:var(--red);border-radius:0 12px 12px 0}
.swipe-del-btn{background:none;border:none;color:#fff;font-size:12px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.swipe-del-icon{font-size:20px}

/* Context menu */
.ctx-menu{position:fixed;background:var(--surface2);border:1px solid var(--border2);border-radius:14px;padding:6px;z-index:300;min-inline-size:160px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.ctx-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:9px;font-size:14px;font-weight:500;cursor:pointer;color:var(--text);transition:background .1s}
.ctx-item:active{background:var(--surface3)}
.ctx-item.danger{color:var(--red)}
.ctx-backdrop{position:fixed;inset:0;z-index:299}

/* ── PANEL ──────────────────────────────── */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-block-end:12px}
.panel-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-block-end:10px}
.date-input{background:var(--surface2);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:var(--font);font-size:15px;padding:10px 14px;inline-size:100%;-webkit-appearance:none;color-scheme:dark}

/* ── STATS ──────────────────────────────── */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-block-end:14px}
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.stat-tile .num{font-size:28px;font-weight:700;font-family:var(--mono);color:var(--text)}
.stat-tile .lbl{font-size:12px;color:var(--text2);margin-block-start:4px}
.stat-tile .sub{font-size:11px;color:var(--text3);margin-block-start:2px}
.log-entry{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-block-end:7px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.log-task{font-size:13px;font-weight:500;color:var(--text)}
.log-time{font-family:var(--mono);font-size:11px;color:var(--text3);text-align:end;flex-shrink:0}
.log-date{font-size:10px;color:var(--text3);margin-block-start:2px}

/* ── FIXED FOOTER ───────────────────────── */
.bottom-bar{position:fixed;inset-block-end:0;inset-inline-start:0;inset-inline-end:0;background:var(--surface);border-block-start:1px solid var(--border);padding:10px 16px;padding-block-end:calc(10px + var(--safe-bottom));display:none;gap:10px;z-index:100}
.bottom-bar.show{display:flex}
.bottom-bar button{flex:1}

/* ── BUTTONS ────────────────────────────── */
.btn-primary{background:var(--accent);border:none;color:#0d1b2a;font-family:var(--font);font-size:13px;font-weight:700;padding:11px 18px;border-radius:11px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-primary:active{transform:scale(.96);background:var(--accent2)}
.btn-secondary{background:var(--surface2);border:1px solid var(--border2);color:var(--text2);font-family:var(--font);font-size:13px;font-weight:600;padding:11px 16px;border-radius:11px;cursor:pointer;transition:all .15s}
.btn-secondary:active{transform:scale(.96)}
.btn-danger{background:var(--red-dim);border:1px solid rgba(255,59,48,.3);color:var(--red);font-family:var(--font);font-size:13px;font-weight:600;padding:11px 16px;border-radius:11px;cursor:pointer}

/* ── TOAST ──────────────────────────────── */
.toast{position:fixed;inset-block-start:76px;inset-inline-start:50%;transform:translateX(-50%) translateY(-8px);background:#1a3a1a;color:var(--green);border:1px solid var(--green-border);font-size:13px;font-weight:700;padding:10px 20px;border-radius:30px;opacity:0;transition:all .22s ease;z-index:999;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── MODAL ──────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;z-index:400;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border-radius:24px 24px 0 0;border:1px solid var(--border2);border-block-end:none;padding:20px;padding-block-end:calc(20px + var(--safe-bottom));inline-size:100%;max-block-size:75vh;overflow-y:auto}
.modal-handle{inline-size:36px;block-size:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:17px;font-weight:700;margin-block-end:16px}
.form-row{display:flex;gap:8px;margin-block-end:10px}
.form-input{background:var(--surface3);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:var(--font);font-size:14px;padding:11px 12px;inline-size:100%;flex:1}
.form-input::placeholder{color:var(--text3)}

/* ── NOTIFY PROMPT ──────────────────────── */
.notify-prompt{background:rgba(155,127,232,.08);border:1px solid rgba(155,127,232,.25);border-radius:var(--r);padding:14px 16px;margin-block-end:12px;display:flex;align-items:center;gap:12px;cursor:pointer}
.notify-prompt .ni{font-size:26px;flex-shrink:0}
.notify-prompt .nt strong{font-size:13px;font-weight:600;display:block;color:var(--text)}
.notify-prompt .nt span{font-size:12px;color:var(--text2)}
.notify-prompt .na{color:var(--text3);font-size:18px;flex-shrink:0}

/* ── NOTIF STATUS BAR ──────────────────── */
.notif-status{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;margin-block-end:12px}
.notif-status-row{display:flex;align-items:center;gap:10px}
.notif-status-icon{font-size:18px;flex-shrink:0}
.notif-status-text{flex:1;font-size:12px;color:var(--text2)}
.notif-status-text strong{color:var(--text);font-weight:600;display:block;font-size:13px;margin-block-end:2px}
.notif-schedule-btn{background:var(--accent);border:none;color:#0d1b2a;font-family:var(--font);font-size:11px;font-weight:700;padding:7px 14px;border-radius:10px;cursor:pointer;flex-shrink:0;white-space:nowrap}
.notif-schedule-btn:active{transform:scale(.96)}
.notif-schedule-btn.disabled{opacity:.5;pointer-events:none}

/* ── EMPTY ──────────────────────────────── */
.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-state .ei{font-size:40px;margin-block-end:12px}
.empty-state p{font-size:14px}

/* ── BADGE COLORS ───────────────────────── */
.badge-prayer{background:rgba(155,127,232,.15);color:#c4b0ff}
.badge-health{background:rgba(52,199,89,.12);color:#5ce87b}
.badge-study{background:rgba(0,122,255,.12);color:#60a5fa}
.badge-skill{background:rgba(245,166,35,.12);color:#f5c842}
.badge-project{background:rgba(255,107,107,.12);color:#ff8f8f}
.badge-sleep{background:rgba(94,106,210,.12);color:#a5b4fc}
.badge-class{background:rgba(15,163,177,.12);color:#67e8f9}
.badge-social{background:rgba(255,159,67,.12);color:#ffbe85}
.badge-review{background:rgba(162,155,254,.12);color:#c7b2ff}
.badge-selfcare{background:rgba(253,121,168,.12);color:#ff9cc8}
.badge-break{background:rgba(99,110,114,.12);color:#a0a8ac}
.badge-travel{background:rgba(253,203,110,.12);color:#ffe08a}
.badge-learning{background:rgba(85,239,196,.12);color:#8dffd7}

@keyframes checkPop{0%{transform:scale(.8)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
.task-check.pop{animation:checkPop .25s ease}
  </style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="app-title">Routine</div>
    <button class="notif-btn" id="notifBtn" onclick="handleNotifBtn()">🔔 Reminders</button>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab active" data-tab="today">Today</button>
    <button class="nav-tab" data-tab="backdate">Backdate</button>
    <button class="nav-tab" data-tab="edit">Edit Routine</button>
    <button class="nav-tab" data-tab="stats">Stats</button>
  </div>
</div>

<div class="main" id="mainArea"></div>

<div class="bottom-bar" id="bottomBar"></div>
<div class="toast" id="toast"></div>

<!-- Task add/edit modal -->
<div class="modal-overlay" id="taskModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">Add Task</div>
    <div class="form-row">
      <input class="form-input" id="modalName" placeholder="Task name (e.g. Morning run)" autocomplete="off">
    </div>
    <div class="form-row">
      <input class="form-input" id="modalTime" placeholder="Time (e.g. 06:00 - 07:30)" style="flex:3" autocomplete="off">
      <select class="form-input" id="modalType" style="flex:2">
        <option value="prayer">Prayer</option>
        <option value="health">Health</option>
        <option value="study">Study</option>
        <option value="skill">Skill</option>
        <option value="project">Project</option>
        <option value="class">Class</option>
        <option value="sleep">Sleep</option>
        <option value="social">Social</option>
        <option value="review">Review</option>
        <option value="selfcare">Selfcare</option>
        <option value="break">Break</option>
        <option value="travel">Travel</option>
        <option value="learning">Learning</option>
      </select>
    </div>
    <div style="display:flex;gap:8px;margin-block-start:4px">
      <button class="btn-primary" id="modalSaveBtn" style="flex:1">Save Task</button>
      <button class="btn-secondary" id="modalCancelBtn">Cancel</button>
    </div>
  </div>
</div>

<script>
/* ================================================================
   ROUTINE TRACKER - Capacitor Edition
   Local notifications via @capacitor/local-notifications (AlarmManager)
   No more setInterval-based polling that dies in background
   ================================================================ */

const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const REMIND_MINUTES_BEFORE = 15;

const BP={
  Sunday:[
    {name:"Wake + Fajr + Gratitude",time:"05:45 AM",type:"prayer"},
    {name:"Morning Exercise (1.5 hrs)",time:"06:00 - 07:30",type:"health"},
    {name:"Breakfast + shower",time:"07:30 - 08:00",type:"selfcare"},
    {name:"Semester Subjects (2.5 hrs)",time:"08:00 - 10:10",type:"study"},
    {name:"Career Skills",time:"10:20 - 11:50",type:"skill"},
    {name:"Bus (audio learning)",time:"12:00 - 02:30",type:"learning"},
    {name:"Classes + Prayers",time:"02:30 - 05:30",type:"class"},
    {name:"Campus gap",time:"05:30 - 06:10",type:"break"},
    {name:"Bus home",time:"06:10 - 07:40",type:"travel"},
    {name:"Rest + Isha",time:"07:40 - 08:10",type:"prayer"},
    {name:"Dinner + family",time:"08:10 - 09:10",type:"social"},
    {name:"Light review",time:"09:10 - 09:40",type:"review"},
    {name:"Sleep",time:"10:00 PM",type:"sleep"}
  ],
  Monday:[
    {name:"Wake + Fajr",time:"06:00 AM",type:"prayer"},
    {name:"Morning Exercise",time:"06:15 - 07:45",type:"health"},
    {name:"Semester Subjects",time:"08:15 - 10:25",type:"study"},
    {name:"Career Skills",time:"10:35 - 12:05",type:"skill"},
    {name:"Project Work",time:"12:45 - 02:15",type:"project"},
    {name:"Evening Exercise",time:"04:05 - 05:35",type:"health"},
    {name:"Light review",time:"07:30 - 08:00",type:"review"},
    {name:"Sleep",time:"10:30 PM",type:"sleep"}
  ],
  Tuesday:[
    {name:"Wake + Fajr",time:"05:00 AM",type:"prayer"},
    {name:"Morning Exercise",time:"05:15 - 06:30",type:"health"},
    {name:"Heavy Classes",time:"08:30 - 04:00",type:"class"},
    {name:"Evening Study",time:"07:20 - 08:35",type:"study"},
    {name:"Evening walk",time:"08:45 - 09:15",type:"health"},
    {name:"Sleep",time:"09:30 PM",type:"sleep"}
  ],
  Wednesday:[
    {name:"Wake + Fajr",time:"05:45 AM",type:"prayer"},
    {name:"Morning Exercise",time:"06:00 - 07:30",type:"health"},
    {name:"Campus Classes",time:"10:00 - 01:00",type:"class"},
    {name:"Semester Subjects",time:"03:30 - 05:20",type:"study"},
    {name:"Career Skills",time:"08:00 - 09:30",type:"skill"},
    {name:"Sleep",time:"10:00 PM",type:"sleep"}
  ],
  Thursday:[
    {name:"Wake + Fajr",time:"05:00 AM",type:"prayer"},
    {name:"Morning Exercise",time:"05:15 - 06:45",type:"health"},
    {name:"Classes/Lab",time:"08:30 - 02:30",type:"class"},
    {name:"Evening Study",time:"07:20 - 08:50",type:"study"},
    {name:"Career Skills",time:"07:20 - 08:20",type:"skill"},
    {name:"Sleep",time:"09:45 PM",type:"sleep"}
  ],

// ── STORAGE ───────────────────────────────────
function load(){

// ── DATE HELPERS ──────────────────────────────
function todayStr(){
  const d=new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function pad(n){return String(n).padStart(2,'0')}
function parseSafe(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function dayOf(s){return DAYS[parseSafe(s).getDay()]}
function getTasks(ds,dn){return custom[`${ds}_${dn}`]?[...custom[`${ds}_${dn}`]]:[...(BP[dn]||[])]}
function tk(ds,dn,i){return `${ds}_${dn}_${i}`}
function isDone(ds,dn,i){return !!comp[tk(ds,dn,i)]?.done}
function getTs(ds,dn,i){return comp[tk(ds,dn,i)]?.ts||null}

// ── TASK TIME -> minutes ──────────────────────
function parseStartMinutes(timeStr){
  const s=timeStr.trim();
  let m;
  // "HH:MM AM/PM"
  m=s.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if(m){
    let h=parseInt(m[1]),min=parseInt(m[2]),mer=m[3].toUpperCase();
    if(mer==='PM'&&h!==12)h+=12;
    if(mer==='AM'&&h===12)h=0;
    return h*60+min;
  }
  // "HH:MM - HH:MM" (24hr range, uses en-dash or hyphen)
  m=s.match(/^(\d{1,2}):(\d{2})/);
  if(m){
    let h=parseInt(m[1]),min=parseInt(m[2]);
    return h*60+min;
  }
  return null;
}

// ── COMPLETION ────────────────────────────────
function toggle(ds,dn,i){
  const key=tk(ds,dn,i);
  if(comp[key]?.done){delete comp[key]}
  else{
    const n=new Date();
    comp[key]={done:true,ts:`${pad(n.getHours())}:${pad(n.getMinutes())}`,full:n.toLocaleString(),iso:n.toISOString()};
    if(navigator.vibrate)navigator.vibrate([30,10,20]);
  }
  recalcStreak(ds,dn);
  save();
  render();
}
function recalcStreak(ds,dn){
  const t=getTasks(ds,dn);
  const done=t.filter((_,i)=>isDone(ds,dn,i)).length;
  streak[ds]={pct:t.length?Math.round(done/t.length*100):0,done,total:t.length};
}
function getStreakCount(){
  let c=0,d=new Date();
  while(c<366){
    const s=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    if(streak[s]&&streak[s].pct>=50){c++;d.setDate(d.getDate()-1)}else break;
  }
  return c;
}
function getWeek(){
  const res=[],today=new Date(),dow=today.getDay(),sw=new Date(today);
  sw.setDate(today.getDate()-dow);
  for(let i=0;i<7;i++){
    const d=new Date(sw);d.setDate(sw.getDate()+i);
    const s=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    res.push({s,abbr:DAYS[d.getDay()].slice(0,2),isToday:s===todayStr()});
  }
  return res;
}

// ── TOAST ─────────────────────────────────────
function toast(msg,err=false){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background=err?'rgba(255,59,48,.15)':'#1a3a1a';
  t.style.color=err?'var(--red)':'var(--green)';
  t.style.borderColor=err?'rgba(255,59,48,.3)':'var(--green-border)';
  t.classList.add('show');
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'),2200);
}

// ── HTML ESCAPE ───────────────────────────────
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function doCheck(ds,dn,i){

  if(el){el.classList.add('pop');setTimeout(()=>el.classList.remove('pop'),300)}

function attachSwipe(i,ds,dn){
  const el=document.getElementById(`ei${i}`);
  const wrap=document.getElementById(`sw${i}`);
  if(!el||!wrap)return;
  let startX=0,curX=0,swiping=false;
  el.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;swiping=false},{passive:true});
  el.addEventListener('touchmove',e=>{
    curX=e.touches[0].clientX;
    const dx=startX-curX;
    if(dx>8){swiping=true;el.style.transform=`translateX(${Math.max(-90,-dx)}px)`;el.style.transition='none'}
    else if(dx<-4){el.style.transform='translateX(0)';el.style.transition='transform .2s'}
  },{passive:true});
  el.addEventListener('touchend',()=>{
    el.style.transition='transform .2s';
    const dx=startX-curX;
    if(dx>50){el.style.transform='translateX(-90px)'}
    else{el.style.transform='translateX(0)'}
  });
}

// ── CSV ───────────────────────────────────────
function dlCSV(){
  const keys=Object.keys(comp).filter(k=>comp[k]?.done).sort();
  let csv='Date,Day,Task,Type,Completed At\n';
  keys.forEach(k=>{
    const e=comp[k],p=k.split('_'),ds=p[0],dn=p[1],i=parseInt(p[2].replace(/\D/g,''));
    const t=getTasks(ds,dn)[i];
    if(t)csv+=`"${ds}","${dn}","${t.name.replace(/"/g,"'")}","${t.type}","${e.full||e.ts}"\n`;
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv'}));
  a.download=`routine_${todayStr()}.csv`;a.click();
  toast('CSV downloaded!');
}
function doReset(){
  if(confirm('Reset ALL completion data? Cannot be undone.')){comp={};streak={};save();render();toast('Cleared')}
}


/* ================================================================
   NOTIFICATION SYSTEM — Capacitor Local Notifications
   Uses the GLOBAL window.Capacitor bridge (no bundler needed)
   Android AlarmManager — survives app kill & device reboot
   ================================================================ */

// Access the LocalNotifications plugin via the global Capacitor bridge
// This works WITHOUT a bundler because Capacitor injects the bridge
// into the WebView automatically when running as a native app.
function getLocalNotifications(){
  try{
    // Capacitor 6: registerPlugin is on the global Capacitor object
    if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications){
      return window.Capacitor.Plugins.LocalNotifications;
    }
    // Fallback: use registerPlugin
    if(window.Capacitor && typeof window.Capacitor.registerPlugin === 'function'){
      return window.Capacitor.registerPlugin('LocalNotifications');
    }
    return null;
  }catch(e){
    console.error('Failed to get LocalNotifications plugin:',e);
    return null;
  }
}

function updateNotifBtn(){
  const btn=document.getElementById('notifBtn');
  if(!btn)return;
  if(isCapacitor){
    btn.className='notif-btn'+(notifPermissionGranted?' active':'');
    btn.textContent=notifPermissionGranted?'Reminders On':'Reminders';
  } else {
    const granted=typeof Notification!=='undefined'&&Notification.permission==='granted';
    btn.className='notif-btn'+(granted?' active':'');
    btn.textContent=granted?'Reminders On':'Reminders';
  }
}

async function handleNotifBtn(){
  if(isCapacitor){
    await requestCapacitorPermission();
  } else {
    // Browser fallback
    if(typeof Notification==='undefined'){toast('Not supported on this device',true);return}
    if(Notification.permission==='granted'){toast('Reminders already on!');return}
    const p=await Notification.requestPermission();
    if(p==='granted'){render();toast('Browser reminders enabled (limited)')}
    else{toast('Permission denied',true)}
  }
}

// ── Capacitor notification permission ─────────
async function requestCapacitorPermission(){
  try{
    const LocalNotifications = getLocalNotifications();
    if(!LocalNotifications){
      toast('Notifications not available',true);
      return;
    }
    // Check current permission
    let permStatus = await LocalNotifications.checkPermissions();
    if(permStatus.display === 'granted'){
      notifPermissionGranted=true;
      render();
      toast('Reminders already allowed!');
      return;
    }
    // Request permission
    permStatus = await LocalNotifications.requestPermissions();
    if(permStatus.display === 'granted'){
      notifPermissionGranted=true;
      await scheduleTodayReminders();
      render();
      toast('Reminders enabled!');
    } else {
      notifPermissionGranted=false;
      toast('Permission denied — check app settings',true);
    }
  }catch(err){
    console.error('Permission error:',err);
    toast('Notification error: '+err.message,true);
  }
}

// ── Schedule today's reminders via AlarmManager ─
async function scheduleTodayReminders(){
  if(!isCapacitor||!notifPermissionGranted) return;
  try{
    const LocalNotifications = getLocalNotifications();
    if(!LocalNotifications) return;

    const ds=todayStr(), dn=dayOf(ds), tasks=getTasks(ds,dn);
    const notifications=[];
    const now=new Date();

    // Cancel all existing scheduled notifications first
    try{
      const pending=await LocalNotifications.getPending();
      if(pending && pending.notifications && pending.notifications.length>0){
        await LocalNotifications.cancel(pending);
      }
    }catch(e){
      console.log('No pending notifications to cancel');
    }

    tasks.forEach((t,i)=>{
      const startMins=parseStartMinutes(t.time);
      if(startMins===null) return;
      const remindAtMins=Math.max(0,startMins-REMIND_MINUTES_BEFORE);

      const remindH=Math.floor(remindAtMins/60);
      const remindM=remindAtMins%60;

      // Build the fire date
      const fireDate=new Date(now.getFullYear(), now.getMonth(), now.getDate(), remindH, remindM, 0);

      // Only schedule if it's in the future
      if(fireDate.getTime()<=now.getTime()) return;

      // Notification ID: must be positive int, unique per task per day
      const notifId=(i+1)*10 + now.getDate();

      notifications.push({
        title: 'Starting in 15 min',
        body: t.name + ' (' + t.time + ')',
        id: notifId,
        schedule: { at: fireDate },
        sound: undefined,
        smallIcon: 'ic_stat_icon',
        iconColor: '#f5a623',
        extra: { taskIndex: i, dateStr: ds, dayName: dn }
      });
    });

    if(notifications.length>0){
      await LocalNotifications.schedule({notifications});
      scheduledCount=notifications.length;
    } else {
      scheduledCount=0;
    }
    save();
    render();
    toast(scheduledCount + ' reminders scheduled for today');
  }catch(err){
    console.error('Schedule error:',err);
    toast('Failed to schedule: ' + err.message, true);
  }
}

// ── Handle notification tap ───────────────────
function setupNotificationListeners(){
  try{
    const LocalNotifications = getLocalNotifications();
    if(!LocalNotifications) return;
    // Listen for notification tap
    LocalNotifications.addListener('localNotificationActionPerformed',(action)=>{
      console.log('Notification tapped:',action);
      render();
    });
  }catch(e){
    console.log('Could not set up notification listeners');
  }
}

// ── Detect Capacitor runtime ──────────────────
// Uses the GLOBAL window.Capacitor object injected by the native bridge
// This works without any bundler or ES module imports
function detectCapacitor(){
  try{
    const cap = window.Capacitor;
    if(cap && cap.isNativePlatform && cap.isNativePlatform()){
      isCapacitor = true;
      console.log('Running in Capacitor native mode');
      // Check existing permission
      const LocalNotifications = getLocalNotifications();
      if(LocalNotifications){
        LocalNotifications.checkPermissions().then(permStatus=>{
          notifPermissionGranted = (permStatus.display === 'granted');
          updateNotifBtn();
          render();
          // Auto-schedule if permission is already granted
          if(notifPermissionGranted){
            setupNotificationListeners();
            scheduleTodayReminders();
          }
        }).catch(e=>{
          console.log('Could not check notification permission:',e);
          render();
        });
      } else {
        console.log('LocalNotifications plugin not found in Capacitor bridge');
        render();
      }
    } else {
      isCapacitor = false;
      console.log('Running in browser mode');
      render();
    }
  }catch(e){
    isCapacitor = false;
    console.log('Capacitor not detected, running in browser mode:',e);
    render();
  }
  updateNotifBtn();
}
